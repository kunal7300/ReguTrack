services:
  api:
    ports: !reset []
    environment:
      NODE_ENV: production
      SECURE_COOKIES: "true"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the public HTTPS URL}
    networks: [default,edge]
    restart: unless-stopped
  ai:
    ports: !reset []
    restart: unless-stopped
  postgres:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  objects:
    restart: unless-stopped
  web:
    build:
      target: production-web
    environment: !override
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN to the HTTPS hostname}
    ports: !override
      - "${PUBLIC_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${PUBLIC_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    networks: [edge]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/api/health/ready"]
    restart: unless-stopped
networks:
  edge:
volumes:
  caddy_data:
  caddy_config:
